<svg width="64" height="64" viewBox="0 0 64 64" fill="none"
    xmlns="http://www.w3.org/2000/svg"
    stroke="#ffffffff" stroke-width="2">

    <!-- Ventana -->
    <rect x="4" y="8" width="56" height="40" rx="4" />

    <!-- Botones superiores -->
    <circle cx="10" cy="14" r="2" />
    <circle cx="18" cy="14" r="2" />
    <circle cx="26" cy="14" r="2" />

    <!-- Widget gráfico -->
    <rect x="12" y="22" width="18" height="16" rx="2" />
    <line x1="16" y1="35" x2="16" y2="27" />
    <line x1="21" y1="35" x2="21" y2="30" />
    <line x1="26" y1="35" x2="26" y2="24" />

    <!-- Widget KPI -->
    <rect x="34" y="22" width="18" height="7" rx="2" />
    <line x1="38" y1="25.5" x2="48" y2="25.5" stroke-linecap="round" />

    <!-- Widget tendencia -->
    <rect x="34" y="31" width="18" height="7" rx="2" />
    <polyline points="38,36 42,34 45,35 49,32"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round" />

    <!-- Barra inferior -->
    <line x1="12" y1="42" x2="52" y2="42" stroke-linecap="round" />

</svg>